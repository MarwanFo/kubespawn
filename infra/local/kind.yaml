kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubespawn
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 9080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 9443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
