server {
    listen 8080;
    server_name _;
    server_tokens off;
    location / {
        proxy_pass http://kubespawn-control-plane:30080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
