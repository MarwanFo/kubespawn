apiVersion: v1
kind: Namespace
metadata:
  name: kubespawn-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubespawn-controller
  namespace: kubespawn-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubespawn-baseline-controller
rules:
  - apiGroups: ['']
    resources: [namespaces, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, create, update, patch, delete]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [preview-runtime]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    resourceNames: [preview-gateway]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kubespawn-preview-deployer]
    verbs: [bind]
---
# A fixed administrator-owned definition; bindings grant these rights only in
# an admitted preview namespace. The runtime controller cannot change this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: kubespawn-preview-deployer}
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubespawn-baseline-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kubespawn-baseline-controller}
subjects:
  - {kind: ServiceAccount, name: kubespawn-controller, namespace: kubespawn-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kubespawn-app-controller, namespace: argocd}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, create, update, patch, delete]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [kubespawn-local-cluster]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kubespawn-app-controller, namespace: argocd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kubespawn-app-controller}
subjects:
  - {kind: ServiceAccount, name: kubespawn-controller, namespace: kubespawn-system}
