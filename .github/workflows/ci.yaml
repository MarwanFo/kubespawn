name: Verify foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: control-plane/*.gradle*
      - name: Test migrations, authentication, and persistence
        working-directory: control-plane
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test integrationTest bootJar

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified Helm and validate the workload chart
        env:
          HELM_VERSION: v3.22.1
        run: |
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          sha256sum -c "helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum"
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          ./linux-amd64/helm lint templates/preview-small -f templates/preview-small/fixtures/render-only.yaml --strict
          ./linux-amd64/helm template preview templates/preview-small -f templates/preview-small/fixtures/render-only.yaml --namespace ks-example-g0001 > /tmp/preview-rendered.yaml
