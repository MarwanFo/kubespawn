spring:
  application:
    name: kubespawn-control-plane
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/kubespawn}
    username: ${DATABASE_USER:kubespawn}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

kubespawn:
  github:
    enabled: ${GITHUB_ENABLED:false}
    app-id: ${GITHUB_APP_ID:}
    private-key-file: ${GITHUB_APP_PRIVATE_KEY_FILE:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: kubespawn-control-plane

