# Example only. The controller must render environment-specific identities and policies.
apiVersion: v1
kind: Namespace
metadata:
  name: ks-example-g0001
  labels:
    app.kubernetes.io/managed-by: kubespawn
    kubespawn.io/environment-id: 00000000-0000-0000-0000-000000000001
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-workload
  namespace: ks-example-g0001
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-quota
  namespace: ks-example-g0001
spec:
  hard:
    requests.cpu: '1'
    limits.cpu: '2'
    requests.memory: 2Gi
    limits.memory: 4Gi
    requests.ephemeral-storage: 2Gi
    limits.ephemeral-storage: 4Gi
    requests.storage: 5Gi
    count/pods: '10'
    count/services: '5'
    count/persistentvolumeclaims: '2'
    count/secrets: '10'
    count/configmaps: '10'
    count/jobs.batch: '5'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: preview-defaults
  namespace: ks-example-g0001
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ks-example-g0001
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
  namespace: ks-example-g0001
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
