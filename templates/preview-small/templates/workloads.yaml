{{- range $name := list "api" "web" }}
{{- $component := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    kubespawn.io/environment-id: {{ $.Values.environmentId | quote }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        kubespawn.io/environment-id: {{ $.Values.environmentId | quote }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccountName }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          {{- if eq $.Values.runtimeProfile "kubespawn-demo" }}
          {{- if eq $name "api" }}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: local}
            - {name: DATABASE_URL, value: 'jdbc:postgresql://preview-database:5432/preview'}
            - {name: DATABASE_USER, value: preview}
            - {name: KUBESPAWN_WORKER_ENABLED, value: 'false'}
            - {name: KUBESPAWN_LIFECYCLE_EXPIRY_ENABLED, value: 'false'}
            - {name: GITHUB_ENABLED, value: 'false'}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: preview-runtime, key: DATABASE_PASSWORD}}
            - name: KUBESPAWN_DEV_TOKEN
              valueFrom: {secretKeyRef: {name: preview-runtime, key: KUBESPAWN_DEV_TOKEN}}
          {{- else }}
          command: [/bin/sh, -c]
          args: ["mkdir -p /tmp/conf.d; exec /docker-entrypoint.sh nginx -g 'daemon off;' "]
          env:
            - {name: NGINX_ENVSUBST_OUTPUT_DIR, value: /tmp/conf.d}
            - {name: NGINX_ENVSUBST_FILTER, value: '^(KUBESPAWN_DEV_TOKEN|PREVIEW_ACCESS_TOKEN)$'}
            - name: KUBESPAWN_DEV_TOKEN
              valueFrom: {secretKeyRef: {name: preview-runtime, key: KUBESPAWN_DEV_TOKEN}}
            - name: PREVIEW_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: preview-runtime, key: PREVIEW_ACCESS_TOKEN}}
          {{- end }}
          {{- end }}
          image: {{ printf "%s@%s" $component.image.repository $component.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $component.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ $component.livenessPath }}
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ $component.healthPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $component.livenessPath }}
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $.Values.runtimeProfile "kubespawn-demo") (eq $name "web") }}
            - name: web-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: web-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and (eq $.Values.runtimeProfile "kubespawn-demo") (eq $name "web") }}
        - name: web-config
          configMap:
            name: preview-web-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kubespawn.io/environment-id: {{ $.Values.environmentId | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
{{- end }}
